<app-header></app-header>
<section class="seccion-confirmacion">

    <div class="confirmacion">

        <div class="icono-confirmacion">
            ✓
        </div>

        <h1>¡Compra confirmada!</h1>

        <p class="mensaje-confirmacion">
            Tu compra se realizó correctamente.
        </p>

        <p class="mensaje-secundario">
            Podés descargar el comprobante de tu compra en formato PDF.
        </p>

        <div class="acciones-confirmacion">

            <button
                class="boton-pdf"
                (click)="descargarPdf()">
                Imprimir PDF
            </button>

            <button
                class="boton-inicio"
                (click)="volverAlInicio()">
                Volver al inicio
            </button>

        </div>

    </div>

</section>
