<app-header></app-header>
<main class="pagina-gestion">

    <h1>Gestión de roles</h1>

    <section class="seccion-usuarios">

        <div class="encabezado-usuarios">

            <h2>Usuarios registrados</h2>

            <input
                class="buscador"
                type="text"
                placeholder="Buscar usuario..."
                [value]="terminosBusqueda()"
                (input)="terminosBusqueda.set($any($event.target).value)">

        </div>

        <div class="contenedor-tabla">

            <table>

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Rol</th>
                    </tr>
                </thead>

                <tbody>

                    @for (usuario of usuariosFiltrados(); track usuario.id) {

                    <tr>

                        <td>{{ usuario.nombre }}</td>

                        <td>{{ usuario.apellido }}</td>

                        <td class="celda-rol">

                            <select
                                class="selector-rol"
                                [disabled]="esMiUsuario(usuario)"
                                (change)="cambiarRol(usuario, $any($event.target).value)">

                                @for (rol of roles; track rol) {
                                <option
                                    [value]="rol"
                                    [selected]="rol == usuario.rol">
                                    {{ rol }}
                                </option>
                                }

                            </select>

                            @if (esMiUsuario(usuario)) {
                            <small class="usuario-actual">Tu usuario</small>
                            }

                        </td>

                    </tr>

                    }

                    @empty {

                    <tr>
                        <td colspan="3" class="sin-usuarios">
                            No se encontraron usuarios.
                        </td>
                    </tr>

                    }

                </tbody>

            </table>

        </div>

    </section>

</main>
