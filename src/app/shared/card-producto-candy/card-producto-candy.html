<article class="card-candy">

    <div class="contenedor-imagen-candy">

        <img
            [src]="productoCandy().imagen"
            [attr.alt]="'Imagen de ' + productoCandy().nombre">

    </div>


    <div class="contenido-card-candy">

        <h4>{{ productoCandy().nombre }}</h4>

        <p class="precio-candy">
            ${{ productoCandy().precio }}
        </p>


        <div class="control-cantidad">

            <button (click)="restarCantidad()">-</button>

            <p>{{ productoCandyCarrito().cantidad }}</p>

            <button (click)="sumarCantidad()">+</button>

        </div>

    </div>

</article>
