<article class="card-pelicula">

    <div class="contenedor-portada">

        <img
            [src]="pelicula().portada"
            [attr.alt]="'Portada de ' + pelicula().titulo">

    </div>


    <div class="contenido-card">

        <h2>{{ pelicula().titulo }}</h2>

        <p class="duracion">
            {{ pelicula().duracion }} min
        </p>


        @if (pelicula().funciones.length > 0 && leyendaPreventa()){

        <p class="preventa">
            Preventa ya disponible!
        </p>

        }


        <a
            class="boton-detalle"
            [routerLink]="['/pelicula', pelicula().id_pelicula]">
            Ver detalle
        </a>

    </div>

</article>
